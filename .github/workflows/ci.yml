name: Repository Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin:
    name: Plugin Checks
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install Python dependencies
        run: python -m pip install -r github-copilot-cli/requirements.txt
      - name: Restore renderer
        run: npm --prefix github-copilot-cli/skills/solution-designer/renderer ci
      - name: Run plugin checks
        run: ./scripts/Test-LisaRepository.ps1 -Suite Plugin

  scout:
    name: Scout Checks
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install shared Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run Scout infrastructure checks
        run: ./scripts/Test-LisaRepository.ps1 -Suite Scout

  gepa:
    name: GEPA Checks
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install GEPA test dependencies
        run: python -m pip install -r github-copilot-cli/requirements.txt -r github-copilot-cli/skills/agent-optimizer/requirements-gepa.txt
      - name: Run synthetic engine checks
        run: ./scripts/Test-LisaRepository.ps1 -Suite Gepa